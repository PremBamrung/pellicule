# Config used inside the container. Paths are container paths; which host
# ports reach the listeners is decided by compose.yaml.

[library]
root  = "/photos"   # bind-mounted read-only
cache = "/cache"

[server]
private_addr = "0.0.0.0:8080"   # published on the host for LAN / tailnet
public_addr  = "0.0.0.0:8081"   # published on host 127.0.0.1 only, for `tailscale funnel`

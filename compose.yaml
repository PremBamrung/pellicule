services:
  pellicule:
    build: .
    image: pellicule:local
    container_name: pellicule
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      RUST_LOG: ${RUST_LOG:-pellicule=info}
      TZ: ${TZ:-Europe/Paris}   # times shown on the Library page
    volumes:
      - ${PHOTOS_DIR:?set PHOTOS_DIR in .env}:/photos:ro
      - ${CACHE_DIR:-./cache}:/cache
      # Config; set PELLICULE_TOML in .env to use another file.
      - ${PELLICULE_TOML:-./docker/pellicule.toml}:/config/pellicule.toml:ro
    ports:
      # Full gallery: LAN and tailnet. No login: never port-forward it.
      # Tailnet only: "<nas tailnet IP>:${PRIVATE_PORT:-8080}:8080".
      - "${PRIVATE_PORT:-8080}:8080"
      # Share links only. Bound to the host's loopback so the only way in from
      # outside is `tailscale funnel` running on the host.
      - "127.0.0.1:${PUBLIC_PORT:-8081}:8081"
    # Later (M5): Intel Quick Sync on the N100 for video transcoding.
    # devices:
    #   - /dev/dri:/dev/dri

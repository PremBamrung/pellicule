[package]
name = "pellicule"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = "0.8.9"
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2.190"
libvips = "2.3.0"
nom-exif = "3.8.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
thumbhash = "0.1.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util", "time"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

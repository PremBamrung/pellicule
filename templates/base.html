<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Before the first paint: the remembered theme (white by default) and a
    // flag so placeholders can fade in only when JavaScript runs.
    document.documentElement.classList.add("js");
    try {
      if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark";
      const density = localStorage.getItem("density");
      if (density) document.documentElement.dataset.density = density;
    } catch {}
  </script>
  <title>{% block title %}Pellicule{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='18' fill='%23141413'/%3E%3Crect x='7' y='11' width='18' height='10' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ layout.css_url }}">
  <script type="module" src="{{ layout.js_url }}"></script>
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="/">Pellicule</a>
    <nav class="masthead-nav">
      <a href="/library">Library</a>
      <button class="theme-toggle" type="button" hidden>Dark</button>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>

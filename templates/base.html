<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply the remembered theme before the first paint (white by default).
    try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}
  </script>
  <title>{% block title %}Pellicule{% endblock %}</title>
  <link rel="preload" href="/static/fonts/eb-garamond-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ layout.css_url }}">
  <script type="module" src="{{ layout.js_url }}"></script>
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="/">Pellicule</a>
    <nav class="masthead-nav">
      <a href="/library">Library</a>
      <button class="theme-toggle" type="button" hidden>Dark</button>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>

<a class="album-card" href="{{ album.href }}">
  {% if let Some(cover) = album.cover %}
  <span class="album-cover ph" style="background-color: {{ cover.background }}" data-thumbhash="{{ cover.thumbhash }}">
    <img src="{{ cover.view_url }}" srcset="{{ cover.cover_srcset }}"
         sizes="(max-width: 720px) 100vw, 50vw"
         width="{{ cover.thumb_width }}" height="{{ cover.thumb_height }}"
         loading="{% if loop.index0 < 4 %}eager{% else %}lazy{% endif %}" decoding="async" alt="">
  </span>
  {% endif %}
  {# Photos from through the album: app.js crossfades through them while
     the card is pointed at. #}
  {% for photo in album.flips %}
  <span class="album-flip" hidden data-src="{{ photo.view_url }}" data-srcset="{{ photo.cover_srcset }}"></span>
  {% endfor %}
  <span class="album-card-title">{{ album.title }}</span>
  <span class="album-card-summary">{{ album.summary }}</span>
</a>
